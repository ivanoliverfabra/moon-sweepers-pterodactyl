name: Build and publish Moon Sweepers Pterodactyl image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.pterodactyl
      - ptero/**
      - native/**
      - container/server/**
      - modding/**
      - .dockerignore
      - .github/workflows/publish-pterodactyl.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        # The egg pulls this fixed image name regardless of the repository name.
        run: echo "name=ghcr.io/ivanoliverfabra/moon-sweepers-pterodactyl" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pterodactyl
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
