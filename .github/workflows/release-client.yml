name: Build and release Moon Sweepers client module

# Publishes moon-sweepers-dedicated-server.zip (client module + installer files)
# that client/install-moon-client.ps1 downloads. Push a tag such as v0.2.0, or run
# the workflow manually with a tag name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build version.dll
        run: docker buildx build -f native/Dockerfile.build -o type=local,dest=native/out native
      - name: Package release ZIP
        run: python3 scripts/package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          zip=dist/moon-sweepers-dedicated-server.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --title "$TAG" --target "$GITHUB_SHA" \
              --notes "Client module and installer files. Install with client/install-moon-client.ps1."
          fi
